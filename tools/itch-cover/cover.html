<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=630" />
<title>Nexhold cover</title>
<!-- Same Google Fonts the game loads in apps/web/index.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Rajdhani:wght@600&family=Share+Tech+Mono&display=block" rel="stylesheet" />
<style>
  /*
    Key-art cover for itch.io. The frame is 630x500 CSS px; render.mjs
    screenshots it at device scale 1 (cover-630x500-operators.png) and 2 (cover-1260x1000-operators.png).
  */
  :root {
    --void: #040409;
    --ink: #e8e3d6;
    --cyan: #45d9e8;
    --violet: #8b5cf6;
    --zentax: #ec4899;
    --serif: Cinzel, "Times New Roman", Georgia, serif;
    --mono: "Share Tech Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 630px; height: 500px; overflow: hidden; background: var(--void); }

  .frame {
    position: relative;
    width: 630px;
    height: 500px;
    overflow: hidden;
    background:
      radial-gradient(60% 55% at 26% 40%, rgba(139, 92, 246, 0.13), transparent 70%),
      radial-gradient(60% 55% at 74% 40%, rgba(236, 72, 153, 0.09), transparent 70%),
      radial-gradient(120% 80% at 50% 0%, #0b0a16 0%, #06060c 55%, var(--void) 100%);
    isolation: isolate;
  }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  #stars { position: absolute; inset: 0; width: 630px; height: 500px; }

  /* HUD line work */
  .hud { position: absolute; inset: 0; width: 630px; height: 500px; overflow: visible; }
  .hud * { vector-effect: non-scaling-stroke; }

  /* operator sigils (same geometry as .sigil in apps/web/src/style.css) */
  .sigil { position: absolute; width: 232px; height: 232px; }
  .sigil svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke: var(--accent); }
  .sigil .hex { stroke-width: 1.3; opacity: var(--hex-alpha, 0.78); }
  .sigil .hex-inner { stroke-width: 1; opacity: 0.3; }
  .sigil .ring { stroke-width: 1; stroke-dasharray: 2 6; opacity: 0.45; }
  .sigil .nodes { fill: var(--accent); stroke: none; opacity: 0.9; }
  .sigil .fill { stroke: none; fill: rgba(6, 5, 11, 0.7); }
  .sigil .tint { stroke: none; }
  .sigil--al { --accent: var(--violet); left: 50px; top: 74px; }
  .sigil--zx { --accent: var(--zentax); --hex-alpha: 0.52; left: 348px; top: 74px; }
  .sigil svg { filter: drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 50%, transparent)); }

  /* AttackLord: three blades rising out of the hex */
  .blades {
    position: absolute;
    left: 166px; top: 194px;
    width: 282px; height: 282px;
    transform: translate(-50%, -50%);
    filter: brightness(0.86) drop-shadow(0 0 14px rgba(139, 92, 246, 0.42));
  }

  /* ZentaX: the puppeteer's hands reaching down out of the dark */
  .hands {
    position: absolute;
    left: 296px; top: 46px;
    width: 336px; height: 224px; /* art is 600x400 */
    -webkit-mask-image: linear-gradient(180deg, transparent 6%, #000 36%);
            mask-image: linear-gradient(180deg, transparent 6%, #000 36%);
  }
  .hands img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    filter: url(#trim-rim) brightness(0.88) contrast(1.06);
  }
  /* puppet strings: hairlines dropping from the fingertips (art coordinates) */
  .hands svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .tag {
    position: absolute;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.24em;
    color: color-mix(in srgb, var(--cyan) 62%, transparent);
    white-space: nowrap;
  }
  .tag b { font-weight: 400; color: var(--accent); }
  .tag--al { --accent: #c4b0ff; left: 64px; top: 340px; }
  .tag--zx { --accent: #f7a3cb; right: 64px; top: 340px; text-align: right; }

  /* a dark planet limb low in frame: depth without spectacle */
  .limb {
    position: absolute;
    left: 50%; top: 362px;
    width: 1500px; height: 1500px;
    margin-left: -750px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 0%, #0d0c18 0%, #05050a 22%, #030307 60%);
    box-shadow:
      0 -1px 0 rgba(69, 217, 232, 0.3),
      0 -5px 22px rgba(139, 92, 246, 0.14),
      0 -2px 60px rgba(69, 217, 232, 0.05);
  }

  /* bottom scrim so the title always sits on near-black */
  .scrim {
    background: linear-gradient(180deg, transparent 58%, rgba(4, 4, 9, 0.82) 74%, var(--void) 92%);
  }
  .vignette {
    background: radial-gradient(120% 100% at 50% 42%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
  }

  /* title block: same treatment as the original gameplay cover */
  .title {
    position: absolute;
    left: 24px; right: 24px; bottom: 26px;
    text-align: center;
  }
  .title__rule {
    width: 64px; height: 2px;
    margin: 0 auto 14px;
    background: color-mix(in srgb, var(--cyan) 82%, #0a1a1c);
  }
  .title h1 {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 49px;
    line-height: 1;
    letter-spacing: 0.005em;
    color: var(--ink);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6), 0 0 22px rgba(0, 0, 0, 0.9);
    white-space: nowrap;
  }
  .title p {
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.34em;
    padding-left: 0.34em; /* recentre: trailing letter-spacing */
    color: color-mix(in srgb, var(--cyan) 88%, #000);
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- ZentaX art carries a pale sticker outline baked into its colour channels.
         Erode the alpha by ~1 css px to cut it away, then add a thin pink rim instead. -->
    <filter id="trim-rim" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="erode" radius="1.6" result="core" />
      <feComposite in="SourceGraphic" in2="core" operator="in" result="body" />
      <feMorphology in="core" operator="dilate" radius="0.6" result="edge0" />
      <feComposite in="edge0" in2="core" operator="out" result="edge" />
      <feFlood flood-color="#ec4899" flood-opacity="0.75" />
      <feComposite in2="edge" operator="in" result="rim" />
      <feGaussianBlur in="core" stdDeviation="5" result="glow0" />
      <feFlood flood-color="#ec4899" flood-opacity="0.28" />
      <feComposite in2="glow0" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="body" />
        <feMergeNode in="rim" />
      </feMerge>
    </filter>
  </defs>
</svg>

<div class="frame">
  <canvas id="stars" width="630" height="500"></canvas>

  <svg class="hud" viewBox="0 0 630 500" aria-hidden="true">
    <g fill="none" stroke="#45d9e8" stroke-width="1">
      <!-- link between the two operators -->
      <line x1="282" y1="190" x2="348" y2="190" stroke-opacity="0.35" />
      <circle cx="315" cy="190" r="9" stroke-opacity="0.45" />
      <line x1="315" y1="174" x2="315" y2="180" stroke-opacity="0.45" />
      <line x1="315" y1="200" x2="315" y2="206" stroke-opacity="0.45" />
      <!-- long range arcs behind -->
      <circle cx="315" cy="190" r="208" stroke-opacity="0.07" stroke-dasharray="1 5" />
      <circle cx="315" cy="190" r="150" stroke-opacity="0.05" />
      <!-- corner brackets (safe margin 24) -->
      <path d="M24 44 V24 H44" stroke-opacity="0.4" />
      <path d="M586 24 H606 V44" stroke-opacity="0.4" />
      <!-- top scale -->
      <g stroke-opacity="0.22">
        <line x1="255" y1="30" x2="375" y2="30" />
        <line x1="255" y1="27" x2="255" y2="33" />
        <line x1="285" y1="28" x2="285" y2="32" />
        <line x1="315" y1="26" x2="315" y2="34" />
        <line x1="345" y1="28" x2="345" y2="32" />
        <line x1="375" y1="27" x2="375" y2="33" />
      </g>
    </g>
  </svg>

  <div class="sigil sigil--al">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <polygon class="fill" points="50,3 93,26.5 93,73.5 50,97 7,73.5 7,26.5" />
      <polygon class="hex" points="50,3 93,26.5 93,73.5 50,97 7,73.5 7,26.5" />
      <polygon class="hex-inner" points="50,13 84,32 84,68 50,87 16,68 16,32" />
      <circle class="ring" cx="50" cy="50" r="31" />
      <g class="nodes">
        <circle cx="50" cy="3.6" r="1.3" /><circle cx="92.4" cy="26.5" r="1.3" />
        <circle cx="92.4" cy="73.5" r="1.3" /><circle cx="50" cy="96.4" r="1.3" />
        <circle cx="7.6" cy="73.5" r="1.3" /><circle cx="7.6" cy="26.5" r="1.3" />
      </g>
    </svg>
  </div>
  <div class="sigil sigil--zx">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <polygon class="fill" points="50,3 93,26.5 93,73.5 50,97 7,73.5 7,26.5" />
      <polygon class="hex" points="50,3 93,26.5 93,73.5 50,97 7,73.5 7,26.5" />
      <polygon class="hex-inner" points="50,13 84,32 84,68 50,87 16,68 16,32" />
      <circle class="ring" cx="50" cy="50" r="31" />
      <g class="nodes">
        <circle cx="50" cy="3.6" r="1.3" /><circle cx="92.4" cy="26.5" r="1.3" />
        <circle cx="92.4" cy="73.5" r="1.3" /><circle cx="50" cy="96.4" r="1.3" />
        <circle cx="7.6" cy="73.5" r="1.3" /><circle cx="7.6" cy="26.5" r="1.3" />
      </g>
    </svg>
  </div>

  <img class="blades" src="assets/attacklord-icon-source.webp" alt="" />
  <div class="hands">
    <svg viewBox="0 0 600 400" aria-hidden="true">
      <defs>
        <linearGradient id="string" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="520">
          <stop offset="0" stop-color="#f472b6" stop-opacity="0.7" />
          <stop offset="1" stop-color="#f472b6" stop-opacity="0" />
        </linearGradient>
      </defs>
      <g stroke="url(#string)" stroke-width="1.5" fill="none">
        <line x1="141" y1="303" x2="141" y2="500" />
        <line x1="204" y1="306" x2="204" y2="480" />
        <line x1="256" y1="218" x2="256" y2="420" />
        <line x1="348" y1="256" x2="348" y2="430" />
        <line x1="406" y1="322" x2="406" y2="510" />
        <line x1="462" y1="313" x2="462" y2="490" />
      </g>
    </svg>
    <img src="../../apps/web/public/images/zeynep-puppet-hands.png" alt="" />
  </div>

  <div class="tag tag--al">OP·01 <b>ATTACKLORD</b></div>
  <div class="tag tag--zx"><b>ZENTAX</b> OP·02</div>

  <div class="layer scrim"></div>
  <div class="limb"></div>
  <div class="layer vignette"></div>

  <div class="title">
    <div class="title__rule"></div>
    <h1>NEXHOLD</h1>
    <p>CO-OP TOWER DEFENSE</p>
  </div>
</div>

<script>
  // Deterministic star field: tiny, dim, round points. No twinkles, no flares.
  (function () {
    const dpr = window.devicePixelRatio || 1;
    const c = document.getElementById("stars");
    c.width = 630 * dpr; c.height = 500 * dpr;
    const g = c.getContext("2d");
    g.scale(dpr, dpr);
    let s = 0x2f6a1c3;
    const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let i = 0; i < 260; i++) {
      const x = rnd() * 630, y = rnd() * 430;
      const big = rnd() < 0.06;
      const r = big ? 0.75 + rnd() * 0.35 : 0.35 + rnd() * 0.3;
      const a = big ? 0.5 + rnd() * 0.3 : 0.18 + rnd() * 0.32;
      const tint = rnd();
      g.fillStyle = tint < 0.15 ? `rgba(190,210,255,${a})` : tint < 0.22 ? `rgba(255,220,200,${a})` : `rgba(235,235,245,${a})`;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
  })();
  document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
</script>
</body>
</html>
